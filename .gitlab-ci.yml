before_script:
  - apt-get update -o Acquire::Check-Valid-Until=false

after_script:
  - gradle --version

bookworm-jdk17:
  image: debian:bookworm-slim
  script:
    - apt-get -y install openjdk-17-jdk-headless gradle
    - gradle build --stacktrace
  artifacts:
    name: public-transport-enabler-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    paths:
      - build/libs/*.jar

trixie-jdk21:
  image: debian:trixie-slim
  script:
    - apt-get -y install openjdk-21-jdk-headless gradle
    - gradle build --stacktrace
  artifacts:
    name: public-transport-enabler-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    paths:
      - build/libs/*.jar

default-jdk:
  image: debian:testing-slim
  script:
    - apt-get -y install default-jdk-headless gradle
    - gradle build --stacktrace
  artifacts:
    name: public-transport-enabler-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    paths:
      - build/libs/*.jar
